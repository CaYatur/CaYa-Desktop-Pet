<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <!-- Lens glass -->
  <circle cx="28" cy="26" r="20" fill="rgba(180,215,255,0.30)"/>
  <!-- Lens rim -->
  <circle cx="28" cy="26" r="20" fill="none" stroke="#8B6914" stroke-width="3.5"/>
  <!-- Inner rim shine -->
  <circle cx="28" cy="26" r="20" fill="none" stroke="#C9A02A" stroke-width="1" opacity="0.5"/>
  <!-- Lens highlight -->
  <ellipse cx="20" cy="18" rx="5" ry="3" fill="white" opacity="0.4" transform="rotate(-30 20 18)"/>
  <!-- Monocle chain -->
  <line x1="46" y1="32" x2="56" y2="54" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Chain end ball -->
  <circle cx="56" cy="54" r="3.5" fill="#8B6914"/>
</svg>
