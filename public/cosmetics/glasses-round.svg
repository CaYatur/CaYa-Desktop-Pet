<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 32">
  <!-- Left lens glass -->
  <circle cx="20" cy="16" r="13" fill="rgba(255,80,80,0.22)"/>
  <!-- Right lens glass -->
  <circle cx="60" cy="16" r="13" fill="rgba(255,80,80,0.22)"/>
  <!-- Left lens rim -->
  <circle cx="20" cy="16" r="13" fill="none" stroke="#222" stroke-width="3"/>
  <!-- Right lens rim -->
  <circle cx="60" cy="16" r="13" fill="none" stroke="#222" stroke-width="3"/>
  <!-- Bridge -->
  <line x1="33" y1="16" x2="47" y2="16" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="0" y1="14" x2="7" y2="16" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="73" y1="16" x2="80" y2="14" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Left highlight -->
  <ellipse cx="13" cy="10" rx="4" ry="2.5" fill="white" opacity="0.35" transform="rotate(-20 13 10)"/>
  <!-- Right highlight -->
  <ellipse cx="53" cy="10" rx="4" ry="2.5" fill="white" opacity="0.35" transform="rotate(-20 53 10)"/>
</svg>
