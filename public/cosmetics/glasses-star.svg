<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 32">
  <!-- Left star lens -->
  <polygon points="20,1 22.9,9.8 32.4,9.8 24.7,15.2 27.6,24 20,18.6 12.4,24 15.3,15.2 7.6,9.8 17.1,9.8"
    fill="rgba(255,210,0,0.55)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right star lens -->
  <polygon points="60,1 62.9,9.8 72.4,9.8 64.7,15.2 67.6,24 60,18.6 52.4,24 55.3,15.2 47.6,9.8 57.1,9.8"
    fill="rgba(255,210,0,0.55)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left highlight -->
  <ellipse cx="16" cy="8" rx="3.5" ry="2" fill="white" opacity="0.4" transform="rotate(-20 16 8)"/>
  <!-- Right highlight -->
  <ellipse cx="56" cy="8" rx="3.5" ry="2" fill="white" opacity="0.4" transform="rotate(-20 56 8)"/>
  <!-- Bridge -->
  <line x1="33" y1="13" x2="47" y2="13" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="0" y1="12" x2="7.5" y2="13" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="72.5" y1="13" x2="80" y2="12" stroke="#333" stroke-width="2" stroke-linecap="round"/>
</svg>
